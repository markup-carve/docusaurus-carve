name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# Every job declares timeout-minutes so a hung step fails in minutes
# rather than inheriting the 360-minute GitHub default.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:all
