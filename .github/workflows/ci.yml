name: CI
on:
  push:
    branches: [main, next2]
  pull_request:
    branches: [main, next2]
# Every job declares timeout-minutes so a hung step fails in minutes
# rather than inheriting the 360-minute GitHub default.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      # The Docusaurus build writes the mirror in Markdown, which the pinned Carve 0.2
      # engine cannot write until its Markdown writer lands (markup-carve/carve-js#5076).
      - name: e2e
        run: |
          if node --input-type=module -e "const m = await import('./src/prepare.mjs'); process.exit((await m.markdownRegistry()) ? 0 : 1)"; then
            npm run test:e2e
          else
            echo "::notice::e2e skipped: needs the Carve 0.2 Markdown writer (markup-carve/carve-js#5076)"
          fi
